---
apiVersion: v1
kind: Namespace
metadata:
  name: gametopia-prod
  labels:
    name: gametopia-prod
    environment: production

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gametopia-api-config
  namespace: gametopia-prod
data:
  ASPNETCORE_ENVIRONMENT: Production
  Swagger__Enabled: "false"
  ASPNETCORE_URLS: http://+:8080

---
apiVersion: v1
kind: Service
metadata:
  name: gametopia-domain-api
  namespace: gametopia-prod
  labels:
    app: gametopia-domain-api
    environment: production
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: gametopia-domain-api

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gametopia-domain-api
  namespace: gametopia-prod
  labels:
    app: gametopia-domain-api
    environment: production
    version: APP_VERSION
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gametopia-domain-api
  template:
    metadata:
      labels:
        app: gametopia-domain-api
        environment: production
        version: APP_VERSION
    spec:
      serviceAccountName: default
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - gametopia-domain-api
              topologyKey: kubernetes.io/hostname
      
      containers:
      - name: gametopia-api
        image: hectorgf/gametopia-domain:IMAGE_TAG
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        
        # Environment Variables from ConfigMap
        envFrom:
        - configMapRef:
            name: gametopia-api-config
        
        # Environment Variables from Secrets
        env:
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: gametopia-db-secret
              key: ConnectionString
        
        # Resource Requests and Limits (homelab with 16GB RAM)
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        
        # Liveness Probe
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness Probe
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        
        # Security Context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        
        # Volume mounts if needed
        volumeMounts:
        - name: log-volume
          mountPath: /app/logs
      
      # Volumes
      volumes:
      - name: log-volume
        emptyDir: {}
      
      # Pod Disruption Budget
      terminationGracePeriodSeconds: 30

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gametopia-domain-api-hpa
  namespace: gametopia-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gametopia-domain-api
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gametopia-domain-api-pdb
  namespace: gametopia-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gametopia-domain-api

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gametopia-domain-api-netpol
  namespace: gametopia-prod
spec:
  podSelector:
    matchLabels:
      app: gametopia-domain-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: gametopia-prod
    - podSelector:
        matchLabels:
          app: gametopia-domain-api
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: gametopia-prod
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 1433
