name: CI/CD - Gametopia Domain

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop

env:
  REGISTRY: docker.io
  DOCKER_REGISTRY_IMAGE: ${{ secrets.DOCKER_USERNAME }}/gametopia-domain
  KUBECONFIG_DEV_PATH: ${{ runner.temp }}/kubeconfig-dev
  KUBECONFIG_PROD_PATH: ${{ runner.temp }}/kubeconfig-prod

jobs:
  # ============================================================================
  # BUILD & TEST JOB
  # ============================================================================
  build-test:
    name: Build, Test & Publish
    runs-on: [self-hosted, linux]
    
    outputs:
      version: ${{ steps.version.outputs.version }}
      docker-tag: ${{ steps.version.outputs.docker-tag }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ========================================================================
      # VERSIONING
      # ========================================================================
      - name: Determine version and environment
        id: version
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV_TYPE="prod"
            # Get current version from csproj or use default
            CURRENT_VERSION=$(grep -oP '<Version>\K[^<]+' Gametopia.Domain.Api/Gametopia.Domain.Api.csproj || echo "0.0.0")
            # Increment patch version
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            PATCH=$((PATCH + 1))
            VERSION="$MAJOR.$MINOR.$PATCH"
            DOCKER_TAG="v$VERSION"
          else
            ENV_TYPE="dev"
            VERSION="0.0.0"
            DOCKER_TAG="latest"
          fi
          
          echo "environment=$ENV_TYPE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "docker-tag=$DOCKER_TAG" >> $GITHUB_OUTPUT
          
          echo "Environment: $ENV_TYPE"
          echo "Version: $VERSION"
          echo "Docker Tag: $DOCKER_TAG"

      # ========================================================================
      # UPDATE VERSION IN CSPROJ (PROD ONLY)
      # ========================================================================
      - name: Update version in .csproj (Production only)
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Update or add Version element in csproj
          if grep -q "<Version>" Gametopia.Domain.Api/Gametopia.Domain.Api.csproj; then
            sed -i "s/<Version>.*<\/Version>/<Version>$VERSION<\/Version>/" Gametopia.Domain.Api/Gametopia.Domain.Api.csproj
          else
            sed -i "/<PropertyGroup>/a\\    <Version>$VERSION</Version>" Gametopia.Domain.Api/Gametopia.Domain.Api.csproj
          fi
          echo "Updated version to: $VERSION"
          cat Gametopia.Domain.Api/Gametopia.Domain.Api.csproj | grep -A 5 "PropertyGroup"

      # ========================================================================
      # RESTORE & BUILD
      # ========================================================================
      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      # ========================================================================
      # TESTS
      # ========================================================================
      - name: Run unit tests
        run: |
          dotnet test \
            Gametopia.Domain.Api.Tests/Gametopia.Domain.Api.Tests.csproj \
            Gametopia.Domain.Application.Tests/Gametopia.Domain.Application.Tests.csproj \
            Gametopia.Domain.Domain.Tests/Gametopia.Domain.Domain.Tests.csproj \
            Gametopia.Domain.Infrastructure.Tests/Gametopia.Domain.Infrastructure.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

      # ========================================================================
      # PUBLISH
      # ========================================================================
      - name: Publish application
        run: |
          dotnet publish Gametopia.Domain.Api/Gametopia.Domain.Api.csproj \
            --configuration Release \
            --output ./publish \
            --no-build

      # ========================================================================
      # DOCKER BUILD & PUSH
      # ========================================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY_IMAGE }}:${{ steps.version.outputs.docker-tag }}
            ${{ env.DOCKER_REGISTRY_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # DEPLOYMENT JOB
  # ============================================================================
  deploy:
    name: Deploy to k3s
    needs: build-test
    runs-on: [self-hosted, linux]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment and kubeconfig
        id: deploy-config
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV_TYPE="prod"
            NAMESPACE="gametopia-prod"
            DEPLOYMENT_FILE="k8s/deployment-prod.yml"
            KUBECONFIG_SECRET="KUBECONFIG_PROD"
          else
            ENV_TYPE="dev"
            NAMESPACE="gametopia-dev"
            DEPLOYMENT_FILE="k8s/deployment-dev.yml"
            KUBECONFIG_SECRET="KUBECONFIG_DEV"
          fi
          
          echo "environment=$ENV_TYPE" >> $GITHUB_OUTPUT
          echo "namespace=$NAMESPACE" >> $GITHUB_OUTPUT
          echo "deployment-file=$DEPLOYMENT_FILE" >> $GITHUB_OUTPUT
          echo "kubeconfig-secret=$KUBECONFIG_SECRET" >> $GITHUB_OUTPUT

      - name: Setup kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_DEV }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_CONTENT" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info

      # ========================================================================
      # CREATE NAMESPACE IF NOT EXISTS
      # ========================================================================
      - name: Create/Update Kubernetes namespace
        run: |
          NAMESPACE="${{ steps.deploy-config.outputs.namespace }}"
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          echo "Namespace '$NAMESPACE' ensured"

      # ========================================================================
      # CREATE SECRETS
      # ========================================================================
      - name: Create database connection string secret
        env:
          CONNECTION_STRING: ${{ secrets.SQLSERVER_DEV_CONNECTIONSTRING }}
        run: |
          NAMESPACE="${{ steps.deploy-config.outputs.namespace }}"
          ENV_TYPE="${{ steps.deploy-config.outputs.environment }}"
          
          if [[ "$ENV_TYPE" == "prod" ]]; then
            CONNECTION_STRING="${{ secrets.SQLSERVER_PROD_CONNECTIONSTRING }}"
          fi
          
          kubectl create secret generic gametopia-db-secret \
            --from-literal=ConnectionString="$CONNECTION_STRING" \
            --namespace="$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -
          
          echo "Secret 'gametopia-db-secret' created/updated in namespace: $NAMESPACE"

      # ========================================================================
      # APPLY DEPLOYMENT
      # ========================================================================
      - name: Deploy to Kubernetes
        run: |
          NAMESPACE="${{ steps.deploy-config.outputs.namespace }}"
          DEPLOYMENT_FILE="${{ steps.deploy-config.outputs.deployment-file }}"
          VERSION="${{ needs.build-test.outputs.version }}"
          DOCKER_TAG="${{ needs.build-test.outputs.docker-tag }}"
          
          # Replace version and image tag in deployment file
          sed -i "s|IMAGE_TAG|$DOCKER_TAG|g" "$DEPLOYMENT_FILE"
          sed -i "s|APP_VERSION|$VERSION|g" "$DEPLOYMENT_FILE"
          
          # Apply deployment
          kubectl apply -f "$DEPLOYMENT_FILE" --namespace="$NAMESPACE"
          
          echo "Deployment applied to namespace: $NAMESPACE"

      # ========================================================================
      # WAIT FOR ROLLOUT
      # ========================================================================
      - name: Wait for deployment rollout
        run: |
          NAMESPACE="${{ steps.deploy-config.outputs.namespace }}"
          kubectl rollout status deployment/gametopia-domain-api \
            --namespace="$NAMESPACE" \
            --timeout=5m

      # ========================================================================
      # VALIDATION
      # ========================================================================
      - name: Verify deployment
        run: |
          NAMESPACE="${{ steps.deploy-config.outputs.namespace }}"
          ENV_TYPE="${{ steps.deploy-config.outputs.environment }}"
          
          echo "=== Deployment Status ==="
          kubectl get deployment -n "$NAMESPACE"
          
          echo -e "\n=== Pod Status ==="
          kubectl get pods -n "$NAMESPACE" -l app=gametopia-domain-api
          
          echo -e "\n=== Services ==="
          kubectl get svc -n "$NAMESPACE"
          
          # Check pod logs
          echo -e "\n=== Pod Logs ==="
          POD=$(kubectl get pods -n "$NAMESPACE" -l app=gametopia-domain-api -o jsonpath='{.items[0].metadata.name}')
          if [ ! -z "$POD" ]; then
            kubectl logs "$POD" -n "$NAMESPACE" --tail=50
          fi

      - name: Deployment successful
        run: |
          echo "✅ Successfully deployed to ${{ steps.deploy-config.outputs.environment }} environment"
          echo "   Namespace: ${{ steps.deploy-config.outputs.namespace }}"
          echo "   Version: ${{ needs.build-test.outputs.version }}"
          echo "   Docker Tag: ${{ needs.build-test.outputs.docker-tag }}"
